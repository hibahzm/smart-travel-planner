[project]
name = "smart-travel-planner-backend"
version = "0.1.0"
description = "Smart Travel Planner – FastAPI backend with LangGraph agent, RAG, and ML classifier"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.10",
    # Config & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    # HTTP
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    # LLM / Agent
    "openai>=1.58.0",
    "langchain>=0.3.13",
    "langchain-openai>=0.2.14",
    "langgraph>=0.2.60",
    "langchain-community>=0.3.13",
    "langsmith>=0.1.147",
    # ML
    "scikit-learn>=1.6.0",
    "imbalanced-learn>=0.13.0",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "joblib>=1.4.2",
    # Embedding
    "tiktoken>=0.8.0",
    # Caching
    "cachetools>=5.5.0",
    "aiocache>=0.12.3",
    # Logging
    "structlog>=24.4.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.7.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() calls in function args

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.7.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
]
